syntax = "proto3";

import "common.proto";

message ExecutionJobJOutput {
    optional bytes stdout = 1;
    Uuid dep_id = 2;
}

message ExecutionJobJOutputs {
    repeated ExecutionJobJOutput execution_job_j_outputs = 1;
}

message JudgeResponse {
    oneof result {
        ExecutionJobJOutputs execution_job_j_outputs = 1;
        string error_message = 2;
    };
}
